name: Build Feather DNS Helper APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'dns-helper/**'
      - '.github/workflows/build-dns-helper.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: dns-helper
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FeatherDnsHelper-debug-apk
          path: dns-helper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
